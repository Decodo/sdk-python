[project]
name = "decodo-sdk"
version = "2.2.0"
description = "Official Python SDK for the Decodo APIs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Decodo" }]
keywords = ["decodo", "scraping", "web-scraping", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/Decodo/sdk-python"
Documentation = "https://help.decodo.com/docs/introduction"
Repository = "https://github.com/Decodo/sdk-python"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]
exclude = ["src/decodo/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["decodo"]
exclude = "src/decodo/generated|^examples/"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
decodo-codegen = "decodo.codegen.codegen:main"
