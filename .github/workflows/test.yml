name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Generate types
        run: python -m decodo.codegen.codegen

      - name: Pytest
        run: pytest

      - name: Build
        run: |
          pip install build
          python -m build
